name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qttools'
          cache: true

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: CMake konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --target stroemling_app -j 4

      - name: Deploy-Ordner erstellen (windeployqt)
        run: |
          mkdir deploy
          copy build\Release\stroemling_app.exe deploy\
          windeployqt --qmldir qml --release deploy\stroemling_app.exe

      - name: ZIP packen
        run: Compress-Archive -Path deploy\* -DestinationPath "Stroemling-Design-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: Stroemling-Design-${{ steps.version.outputs.version }}-windows-x64
          path: Stroemling-Design-${{ steps.version.outputs.version }}-windows-x64.zip
          retention-days: 30
